[package]
name = "xylitol"
version = "0.0.0-dev"
edition = "2024"
license = "MIT"
repository = "https://github.com/straydragon/xylitol"
description = "xylitol (placeholder)"
readme = "README.md"
keywords = []
categories = []
resolver = "2"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
schemars = { version = "1", features = ["derive"] }
jsonschema = "0.46"
minijinja = { version = "2", features = ["json", "builtins"] }
dotenvy = "0.15"
dirs = "6"
thiserror = "2"
tracing = "0.1"
clap = { version = "4.6.1", features = ["derive"] }
adk-core = "0.8.2"
tokio = { version = "1.52.3", features = ["fs", "process", "io-util", "macros", "rt", "rt-multi-thread"] }
async-trait = "0.1.89"
similar = "3.1.0"
glob = "0.3.3"
adk-agent = "0.8.2"
adk-runner = { version = "0.8.2", default-features = false }
adk-model = { version = "0.8.2", features = ["openai", "anthropic"] }
adk-session = { version = "0.8.2", features = ["sqlite"] }
futures = "0.3.32"
lspz = { version = "0.9.3", features = ["agent-sdk"] }
anyhow = "1.0.102"

[features]
default = ["ui-tui", "infra-session", "ui-review"]

# ── agent/ layer ──────────────────────────────
agent-planning = []
agent-model-lock = []

# ── infra/ layer ──────────────────────────────
infra-lsp = []
infra-dap = []
infra-acp = []
infra-skills = []
infra-session = []
infra-sandbox = []
infra-rtk = []

# ── interface/ layer ──────────────────────────
ui-tui = []
ui-review = []

# ── development only ──────────────────────────
dev-vt100 = []
dev-e2e = []
dev-fake-provider = []

[profile.dev]
opt-level = 0
codegen-units = 256
debug = 2
incremental = true

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "z"
codegen-units = 1
lto = "thin"
strip = "symbols"
panic = "abort"
incremental = false

[dev-dependencies]
tempfile = "3.27.0"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
