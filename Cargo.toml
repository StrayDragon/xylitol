[package]
name = "xylitol"
version = "0.0.0-pre"
edition = "2024"
# rust-toolchain.toml is the compiler pin (dated nightly).
# rust-version must stay below that nightly's x.y.z — Cargo treats
# `1.100.0-nightly` as a prerelease and rejects rust-version = "1.100.0".
rust-version = "1.98.1"
license = "MIT"
repository = "https://github.com/straydragon/xylitol"
description = "Out-of-the-box personal coding agent (LLM-augmented dev toolkit)"
keywords = []
categories = []

[workspace]
resolver = "2"
members = ["packages/xylitol-tui", "packages/xylitol-ai-bridge"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.28", features = ["derive"] }
schemars = { version = "1", features = ["derive"] }
jsonschema = "0.55"
minijinja = { version = "2.24.0", features = ["json", "builtins"] }
dirs = "6"
thiserror = "2.0.20"
# Timeline tracing (c1000): enable at the binary crate; FileReporter is file-only.
fastrace = { version = "0.7.19", features = ["enable"] }
# Optional OTLP export (c1475): fastrace → OpenTelemetry → Langfuse/Collector.
fastrace-opentelemetry = { version = "0.18", optional = true }
opentelemetry = { version = "0.32", default-features = false, features = ["trace"], optional = true }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace"], optional = true }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "http-proto", "http-json", "reqwest-client", "reqwest-rustls"], optional = true }
log = "0.4"
env_logger = "0.11"
clap = { version = "4.6.6", features = ["derive"] }
tokio = { version = "1.53.1", features = ["fs", "process", "io-util", "macros", "rt", "rt-multi-thread", "signal", "sync", "time"] }
async-trait = "0.1.92"
similar = "3.2.0"
glob = "0.3.4"
futures = "0.3.34"
anyhow = "1.0.104"
regex = "1.13.1"
rmcp = { version = "1.8.0", features = ["client", "transport-child-process", "transport-streamable-http-client", "transport-streamable-http-client-reqwest"] }
sha2 = "0.11.0"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros"] }
uuid = { version = "1.26.0", features = ["v4"] }

base64 = "0.22.1"

# ── image processing ──
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
url = { version = "2.5.8" }

reqwest = { version = "0.13.5", default-features = false, features = ["stream", "json", "rustls", "charset", "http2", "system-proxy"] }
async-stream = "0.3.6"
tokio-util = "0.7.19"
yaml_serde = "0.10.7"

salvo = { version = "0.95.2", optional = true, default-features = true, features = ["websocket", "test"] }
salvo-oapi = { version = "0.95.2", optional = true, default-features = false, features = ["scalar"] }
tokio-tungstenite = { version = "0.29", features = ["connect", "handshake"], optional = true }

# ── terminal UI ──
# Product TUI is host-driven on the xylitol-tui engine (packages/xylitol-tui);
# in-tree product host/layout layers live under src/app/tui/.
xylitol-tui = { path = "packages/xylitol-tui", optional = true }
xylitol-ai-bridge = { path = "packages/xylitol-ai-bridge" }
crossterm = { version = "0.29", optional = true, features = ["event-stream"] }
http = "1"
jsonrpsee = { version = "0.26.0", default-features = false, features = ["server-core", "jsonrpsee-types"], optional = true }

[features]
default = ["cli", "tui", "otel", "server"]
# CLI composition root.
cli = []
# Always-on HTTP/WebSocket server (product TUI attach default).
server = ["dep:salvo", "dep:salvo-oapi", "dep:tokio-tungstenite", "dep:jsonrpsee"]
# Terminal UI surface (host-driven on xylitol-tui).
tui = ["dep:xylitol-tui", "dep:crossterm"]
# Optional OTLP/HTTP export (Langfuse / Collector). Default on for local agents;
# config still defaults to exporter=none (zero remote traffic until configured).
otel = [
    "dep:fastrace-opentelemetry",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
]

# Disk-first dev profile (see docs/research/rust-disk-worktree-cache-2026.md).
# Trade: no variable-level DWARF; no incremental cache. Backtrace line info kept.
[profile.dev]
opt-level = 0
codegen-units = 16
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "z"
codegen-units = 1
lto = "thin"
strip = "symbols"
panic = "abort"
incremental = false

[dev-dependencies]
tempfile = "3.27.0"
# Property-based invariants (roundtrip / idempotence / monotonicity); see
# skill l8ng-test-methodology → rust.md for the pattern library.

insta = { version = "1.48.0", features = ["filters", "glob"] }
# Statistical micro-benchmarks (benches/); run via `cargo bench`, not qa.
criterion = "0.8"
# portable-pty: end-to-end TUI integration tests (c405 layer 5a) — spawn the
# real binary under a PTY, inject keys, read bytes back into a vte cell grid.
portable-pty = "0.9"
# vte: ANSI parser for the E2E cell-grid oracle (shared by pty + tmux drivers).
vte = "0.13"
serial_test = "3.5.0"
wiremock = "0.6.5"
rstest = "0.26"
rstest-bdd = "0.6.0-beta3"
rstest-bdd-macros = "0.6.0-beta3"

# compile-time-validation intentionally OFF: in this crate the macro's
# compile-time step registry stays empty (one "step registry has no
# definitions" warning per #[scenario], 443 total) while all steps resolve at
# runtime — the qa BDD gate catches missing steps itself. Revisit when an
# upstream release fixes cross-module registry collection.

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
