[package]
name = "xylitol"
version = "0.0.0-dev"
edition = "2024"
license = "MIT"
repository = "https://github.com/straydragon/xylitol"
description = "xylitol (placeholder)"
readme = "README.md"
keywords = []
categories = []
resolver = "2"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["derive"] }
jsonschema = "0.46"
minijinja = { version = "2.21.0", features = ["json", "builtins"] }
dirs = "6"
thiserror = "2.0.18"
tracing = "0.1.44"
clap = { version = "4.6.1", features = ["derive"] }
tokio = { version = "1.52.3", features = ["fs", "process", "io-util", "macros", "rt", "rt-multi-thread", "signal", "sync", "time"] }
async-trait = "0.1.89"
similar = "3.1.1"
glob = "0.3.3"
futures = "0.3.32"
anyhow = "1.0.103"
regex = "1.12.4"
const_format = "0.2"
rmcp = { version = "1.8.0", features = ["client", "transport-child-process", "transport-streamable-http-client", "transport-streamable-http-client-reqwest"] }
zstd = "0.13.3"
sha2 = "0.11.0"
chrono = { version = "0.4.45", features = ["serde"] }
hex = "0.4.3"
uuid = { version = "1.23.4", features = ["v4"] }

base64 = "0.22.1"

# ── image processing ──
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
url = { version = "2.5.8" }
flate2 = { version = "1.1.9" }
tar = { version = "0.4.46" }

notify = { version = "8" }
async-openai = { version = "0.41.1", default-features = false, features = ["chat-completion", "rustls"] }
reqwest = { version = "0.13.4", features = ["stream", "json"] }
eventsource-stream = "0.2.3"
async-stream = "0.3.6"
tokio-util = "0.7.18"
yaml_serde = "0.10.4"

pathdiff = "0.2.3"
axum = { version = "0.8", features = ["ws"], optional = true }
tokio-tungstenite = { version = "0.29", features = ["connect", "handshake"], optional = true }
tower-http = { version = "0.7", features = ["cors"], optional = true }

# ── terminal rendering (optional diff_review backend) ──
# ratatui/crossterm are pulled in only when the `tui` feature is on.
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"], optional = true }
crossterm = { version = "0.29.0", optional = true, features = ["event-stream"] }
# Display-width for CJK cursor alignment (ratatui uses it too; we need it directly).
unicode-width = { version = "0.2", optional = true }

[features]
default = ["cli"]
# CLI composition root (implies rpc because the CLI can dispatch to stdio RPC mode).
cli = ["rpc"]
# stdio RPC transport.
rpc = []
# Always-on HTTP/WebSocket server.
server = ["dep:axum", "dep:tokio-tungstenite", "dep:tower-http"]
# Terminal UI (ratatui/crossterm backend).
tui = ["dep:ratatui", "dep:crossterm", "dep:unicode-width"]
# Future GUI placeholder.
gui = []

[profile.dev]
opt-level = 0
codegen-units = 256
debug = 2
incremental = true

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "z"
codegen-units = 1
lto = "thin"
strip = "symbols"
panic = "abort"
incremental = false

[dev-dependencies]
tempfile = "3.27.0"
assert_cmd = "2.2.2"
assert_matches = "1.5.0"

insta = { version = "1.48.0", features = ["filters", "glob"] }
serial_test = "3.5.0"
test-case = "3.3.1"
wiremock = "0.6.5"
rstest = "0.26"
rstest-bdd = "0.6.0-beta2"
rstest-bdd-macros = { version = "0.6.0-beta2", features = ["compile-time-validation"] }

# In CI, to catch missing steps at compile time, use:
#   cargo test --features rstest-bdd-macros/compile-time-validation
# The feature is enabled here primarily for IDE support.

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
