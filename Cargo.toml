[package]
name = "xylitol"
version = "0.0.0-dev"
edition = "2024"
license = "MIT"
repository = "https://github.com/straydragon/xylitol"
description = "xylitol (placeholder)"
readme = "README.md"
keywords = []
categories = []
resolver = "2"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
schemars = { version = "1", features = ["derive"] }
jsonschema = "0.46"
minijinja = { version = "2", features = ["json", "builtins"] }
dotenvy = "0.15"
dirs = "6"
thiserror = "2"
tracing = "0.1"
clap = { version = "4.6.1", features = ["derive"] }

[features]
default = ["ui-tui", "infra-session", "ui-review"]

# ── agent/ layer ──────────────────────────────
agent-planning = []
agent-model-lock = []

# ── infra/ layer ──────────────────────────────
infra-lsp = []
infra-dap = []
infra-acp = []
infra-skills = []
infra-session = []
infra-sandbox = []
infra-rtk = []

# ── interface/ layer ──────────────────────────
ui-tui = []
ui-review = []

# ── development only ──────────────────────────
dev-vt100 = []
dev-e2e = []

[profile.dev]
opt-level = 0
codegen-units = 256
debug = 2
incremental = true

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "z"
codegen-units = 1
lto = "thin"
strip = "symbols"
panic = "abort"
incremental = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
