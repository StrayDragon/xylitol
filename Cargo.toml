[package]
name = "xylitol"
version = "0.0.0-dev"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/straydragon/xylitol"
description = "xylitol (placeholder)"
readme = "README.md"
keywords = []
categories = []

[workspace]
resolver = "2"
members = ["packages/xylitol-tui", "packages/xylitol-ai-bridge"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.28", features = ["derive"] }
schemars = { version = "1", features = ["derive"] }
jsonschema = "0.46"
minijinja = { version = "2.21.0", features = ["json", "builtins"] }
dirs = "6"
thiserror = "2.0.18"
# Timeline tracing (c1000): enable at the binary crate; FileReporter is file-only.
fastrace = { version = "0.7.18", features = ["enable"] }
fastrace-futures = "0.7.18"
# Optional OTLP export (c1475): fastrace → OpenTelemetry → Langfuse/Collector.
fastrace-opentelemetry = { version = "0.18", optional = true }
opentelemetry = { version = "0.32", default-features = false, features = ["trace"], optional = true }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace"], optional = true }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "http-proto", "http-json", "reqwest-client", "reqwest-rustls"], optional = true }
log = "0.4"
env_logger = "0.11"
clap = { version = "4.6.1", features = ["derive"] }
tokio = { version = "1.52.3", features = ["fs", "process", "io-util", "macros", "rt", "rt-multi-thread", "signal", "sync", "time"] }
async-trait = "0.1.89"
similar = "3.1.1"
glob = "0.3.3"
futures = "0.3.32"
anyhow = "1.0.103"
regex = "1.12.4"
rmcp = { version = "1.8.0", features = ["client", "transport-child-process", "transport-streamable-http-client", "transport-streamable-http-client-reqwest"] }
zstd = "0.13.3"
sha2 = "0.11.0"
hex = "0.4.3"
time = { version = "0.3.53", features = ["formatting", "parsing", "macros"] }
uuid = { version = "1.23.4", features = ["v4"] }

base64 = "0.22.1"

# ── image processing ──
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
url = { version = "2.5.8" }
flate2 = { version = "1.1.9" }
tar = { version = "0.4.46" }

notify = { version = "8" }
reqwest = { version = "0.13.4", default-features = false, features = ["stream", "json", "rustls", "charset", "http2", "system-proxy"] }
async-stream = "0.3.6"
tokio-util = "0.7.18"
yaml_serde = "0.10.4"

pathdiff = "0.2.3"
axum = { version = "0.8", features = ["ws"], optional = true }
tokio-tungstenite = { version = "0.29", features = ["connect", "handshake"], optional = true }
tower-http = { version = "0.7", features = ["cors"], optional = true }

# ── terminal UI (product surface redesigns on packages/xylitol-tui) ──
# Old in-tree engine/widgets under src/app/tui/ were removed; the app surface is
# a placeholder until the xylitol-tui-based rewrite. Keep the path dep so the
# workspace builds uniformly and the package stays testable in-tree.
xylitol-tui = { path = "packages/xylitol-tui", optional = true }
xylitol-ai-bridge = { path = "packages/xylitol-ai-bridge" }
crossterm = { version = "0.29", optional = true, features = ["event-stream"] }
http = "1"

[features]
default = ["cli", "tui", "otel"]
# CLI composition root.
cli = []
# Always-on HTTP/WebSocket server.
server = ["dep:axum", "dep:tokio-tungstenite", "dep:tower-http"]
# Terminal UI surface (host-driven on xylitol-tui).
tui = ["dep:xylitol-tui", "dep:crossterm"]
# Optional OTLP/HTTP export (Langfuse / Collector). Default on for local agents;
# config still defaults to exporter=none (zero remote traffic until configured).
otel = [
    "dep:fastrace-opentelemetry",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
]

# Disk-first dev profile (see docs/research/rust-disk-worktree-cache-2026.md).
# Trade: no variable-level DWARF; no incremental cache. Backtrace line info kept.
[profile.dev]
opt-level = 0
codegen-units = 16
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "z"
codegen-units = 1
lto = "thin"
strip = "symbols"
panic = "abort"
incremental = false

[dev-dependencies]
tempfile = "3.27.0"
xylitol-ai-bridge = { path = "packages/xylitol-ai-bridge" }
assert_cmd = "2.2.2"
assert_matches = "1.5.0"
async-trait = "0.1.89"

insta = { version = "1.48.0", features = ["filters", "glob"] }
# Statistical micro-benchmarks (benches/); run via `cargo bench`, not qa.
criterion = "0.8"
# portable-pty: end-to-end TUI integration tests (c405 layer 5a) — spawn the
# real binary under a PTY, inject keys, read bytes back into a vte cell grid.
portable-pty = "0.9"
# vte: ANSI parser for the E2E cell-grid oracle (shared by pty + tmux drivers).
vte = "0.13"
serial_test = "3.5.0"
test-case = "3.3.1"
wiremock = "0.6.5"
rstest = "0.26"
rstest-bdd = "0.6.0-beta3"
rstest-bdd-macros = { version = "0.6.0-beta3", features = ["compile-time-validation"] }

# In CI, to catch missing steps at compile time, use:
#   cargo test --features rstest-bdd-macros/compile-time-validation
# The feature is enabled here primarily for IDE support.

[[bench]]
name = "token_estimator"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
