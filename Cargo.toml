[package]
name = "xylitol"
version = "0.0.0-dev"
edition = "2024"
license = "MIT"
repository = "https://github.com/straydragon/xylitol"
description = "xylitol (placeholder)"
readme = "README.md"
keywords = []
categories = []
resolver = "2"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
schemars = { version = "1", features = ["derive"] }
jsonschema = "0.46"
minijinja = { version = "2", features = ["json", "builtins"] }
dotenvy = "0.15"
dirs = "6"
thiserror = "2"
tracing = "0.1"
clap = { version = "4.6.1", features = ["derive"] }
adk-core = "0.9.1"
tokio = { version = "1.52.3", features = ["fs", "process", "io-util", "macros", "rt", "rt-multi-thread", "sync", "time"] }
async-trait = "0.1.89"
similar = "3.1.0"
glob = "0.3.3"
adk-agent = "0.9.1"
adk-runner = { version = "0.9.1", default-features = false }
adk-model = { version = "0.9.1", features = ["openai", "anthropic"] }
adk-session = { version = "0.9.1", features = ["sqlite"] }
futures = "0.3.32"
lspz = { version = "0.9.3", features = ["agent-sdk"] }
anyhow = "1.0.102"
regex = "1.12.3"
rmcp = { version = "1.7.0", features = ["client", "transport-child-process", "transport-streamable-http-client", "transport-streamable-http-client-reqwest"] }
zstd = "0.13.3"
rmp-serde = "1.3.1"
sha2 = "0.11.0"
chrono = { version = "0.4.44", features = ["serde"] }
hex = "0.4.3"
uuid = { version = "1.23.1", features = ["v4"] }

# ── ui-review / ui-tui dependencies (optional) ──
ratatui = { version = "0.30", optional = true, default-features = false, features = ["crossterm", "scrolling-regions", "unstable-backend-writer"] }
crossterm = { version = "0.29", optional = true, features = ["bracketed-paste", "event-stream"] }
leaf-core = { version = "0.1.0", path = "../leaf/crates/leaf-core", optional = true }
tui-textarea = { version = "0.11.0", package = "tui-textarea-2", features = ["crossterm"], optional = true }
unicode-width = { version = "0.2", optional = true }
libc = { version = "0.2", optional = true }
vt100 = { version = "0.15", optional = true }
shlex = { version = "1", optional = true }

# ── acp dependencies (optional, infra-acp) ─────
agent-client-protocol = { version = "0.12.1", optional = true }

[features]
default = [
    "agent-planning",
    "agent-model-lock",
    "infra-lsp",
    "infra-dap",
    "infra-acp",
    "infra-skills",
    "infra-session",
    "infra-sandbox",
    "infra-rtk",
    "ui-tui",
    "ui-review",
]

# ── agent/ layer ──────────────────────────────
agent-planning = []
agent-model-lock = []

# ── infra/ layer ──────────────────────────────
infra-lsp = []
infra-dap = []
infra-acp = ["dep:agent-client-protocol"]
infra-skills = []
infra-session = []
infra-sandbox = []
infra-rtk = []

# ── interface/ layer ──────────────────────────
ui-tui = ["dep:ratatui", "dep:crossterm", "dep:leaf-core", "dep:tui-textarea", "dep:unicode-width", "dep:libc", "dep:shlex"]
ui-review = ["dep:ratatui", "dep:crossterm"]

# ── development only ──────────────────────────
dev-vt100 = ["dep:vt100"]
dev-e2e = []
dev-fake-provider = []

[profile.dev]
opt-level = 0
codegen-units = 256
debug = 2
incremental = true

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "z"
codegen-units = 1
lto = "thin"
strip = "symbols"
panic = "abort"
incremental = false

[dev-dependencies]
tempfile = "3.27.0"
assert_cmd = "2.0.17"
assert_matches = "1.5.0"
ctor = "0.5.0"
insta = { version = "1.43.2", features = ["filters", "glob"] }
serial_test = "3.2.0"
test-case = "3.3.1"
wiremock = "0.6.5"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
