[package]
name = "xylitol"
version = "0.0.0-dev"
edition = "2024"
license = "MIT"
repository = "https://github.com/straydragon/xylitol"
description = "xylitol (placeholder)"
readme = "README.md"
keywords = []
categories = []
resolver = "2"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["derive"] }
jsonschema = "0.46"
minijinja = { version = "2", features = ["json", "builtins"] }
dirs = "6"
thiserror = "2"
tracing = "0.1"
clap = { version = "4.6.1", features = ["derive"] }
tokio = { version = "1.52.3", features = ["fs", "process", "io-util", "macros", "rt", "rt-multi-thread", "sync", "time"] }
async-trait = "0.1.89"
similar = "3.1.0"
glob = "0.3.3"
futures = "0.3.32"
anyhow = "1.0.102"
regex = "1.12.3"
rmcp = { version = "1.7.0", features = ["client", "transport-child-process", "transport-streamable-http-client", "transport-streamable-http-client-reqwest"] }
zstd = "0.13.3"
sha2 = "0.11.0"
chrono = { version = "0.4.44", features = ["serde"] }
hex = "0.4.3"
uuid = { version = "1.23.1", features = ["v4"] }

base64 = "0.22.1"

# ── image processing ──
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
url = { version = "2" }
flate2 = { version = "1" }
tar = { version = "0.4" }
zip = { version = "2" }
notify = { version = "7" }
async-openai = { version = "0.40.2", default-features = false, features = ["chat-completion", "rustls"] }
reqwest = { version = "0.13.4", features = ["stream", "json"] }
eventsource-stream = "0.2.3"
async-stream = "0.3.6"
tokio-util = "0.7.18"
yaml_serde = "0.10.4"
serde_yaml = "0.9.34"
pathdiff = "0.2.3"

# ── terminal rendering (optional diff_review backend) ──
# ratatui/crossterm are pulled in only when the `ui-review` feature is on.
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"], optional = true }
crossterm = { version = "0.29.0", optional = true }

[features]
default = []
# Interactive diff-review UI (terminal ratatui/crossterm backend).
# Off by default to keep the main build free of terminal-rendering deps.
ui-review = ["dep:ratatui", "dep:crossterm"]

[profile.dev]
opt-level = 0
codegen-units = 256
debug = 2
incremental = true

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "z"
codegen-units = 1
lto = "thin"
strip = "symbols"
panic = "abort"
incremental = false

[dev-dependencies]
tempfile = "3.27.0"
assert_cmd = "2.0.17"
assert_matches = "1.5.0"
ctor = "0.5.0"
insta = { version = "1.43.2", features = ["filters", "glob"] }
serial_test = "3.2.0"
test-case = "3.3.1"
wiremock = "0.6.5"
rstest = "0.26"
rstest-bdd = "0.6.0-beta2"
rstest-bdd-macros = { version = "0.6.0-beta2", features = ["compile-time-validation"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
