version: 1
phase: m3

dataset:
  name: deep-swe/tasks
  revision: v1.1
  split: test
  instance_ids: ["actionlint-action-pinning-lint"]
  limit: 0

model:
  alias: "group/glm-5.3-flash"
  thinking_level: "high"
  thinking_levels: ["low", "high"]
  api: openai-responses
  context_window: 1000000
  max_output_tokens: 128000
  base_url_env: MAGPIE_GATEWAY_URL
  api_key_env: MAGPIE_GATEWAY_KEY

agent:
  binary: target/eval-bin/xylitol-linux-x86_64-musl
  max_steps_per_turn: 80
  wall_seconds: 1800
  trust: false

sandbox:
  backend: docker
  image: dataset
  network: model_only
  cpus: 2
  memory: 4g

grader:
  backend: harbor
  version: "v1.1"
  run_id: m3-actionlint
  max_workers: 2

report:
  formats: [json, markdown]
  run_dir: target/eval-runs
