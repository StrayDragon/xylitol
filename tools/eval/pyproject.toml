[project]
name = "xylitol-eval"
version = "0.1.0"
description = "Headless Harbor-first eval harness for xylitol"
requires-python = ">=3.11,<3.13"
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
harness = [
  "swebench==5.0.2",
  "docker>=7.0",
  "datasets>=5.0",
]
dev = [
  "pytest>=8.0",
]

[project.scripts]
xylitol-eval = "xylitol_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xylitol_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
  "integration: requires Docker or network",
]
