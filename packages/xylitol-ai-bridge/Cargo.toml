[package]
name = "xylitol-ai-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
description = "LLM provider bridge + multi-source token accounting for xylitol"
repository = "https://github.com/straydragon/xylitol"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
async-stream = "0.3"
tokio = { version = "1", features = ["time", "sync", "macros", "rt"] }
tokio-util = "0.7"
reqwest = { version = "0.13", features = ["stream", "json"] }
eventsource-stream = "0.2"
# OpenAI path: Chat Completions + Responses (+ BYOT Value streams) + middleware hooks.
# TLS: exactly one backend — `rustls` (bundled aws-lc-rs). Do not also enable native-tls*.
async-openai = { version = "0.41", default-features = false, features = [
  "chat-completion",
  "responses",
  "byot",
  "middleware",
  "rustls",
] }
tower = { version = "0.5", default-features = false, features = ["util"] }
fastrace = { version = "0.7", features = ["enable"] }
uuid = { version = "1", features = ["v4"] }
log = "0.4"
tiktoken-rs = "0.6"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
dirs = "6"
partial-json-fixer = "0.5.3"

[dev-dependencies]
serial_test = "3.5.0"
wiremock = "0.6"
tempfile = "3"
yaml_serde = "0.10.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
