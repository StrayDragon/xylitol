[package]
name = "xylitol-tui"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Rust port of pi-tui: terminal UI with differential rendering"
repository = "https://github.com/straydragon/xylitol"

[dependencies]
crossterm = "0.29"
unicode-width = "0.2"
unicode-segmentation = "1.12"
pulldown-cmark = "0.13"

[dev-dependencies]
vte = "0.13"
# tokio powers the async-driven test cases (try_render throttle, event loop).
# The runtime itself stays optional; the core TUI is sync so it can be driven
# from any host loop without forcing a runtime choice.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "test-util"] }
# insta: whole-screen snapshot golden (c405 layer 2) — viewport output regression.
insta = { version = "1", features = ["filters"] }
# proptest: state-machine property tests (c405 layer 4) — random key sequences.
proptest = "1"

[[example]]
name = "demo"
path = "examples/demo.rs"

[[example]]
name = "agent_demo"
path = "examples/agent_demo.rs"
