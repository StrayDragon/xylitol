[package]
name = "xylitol-tui"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Rust port of pi-tui: terminal UI with differential rendering"
repository = "https://github.com/straydragon/xylitol"

[dependencies]
crossterm = "0.29"
unicode-width = "0.2"
unicode-segmentation = "1.12"

[dev-dependencies]
vte = "0.13"

[[example]]
name = "demo"
path = "examples/demo.rs"

[[example]]
name = "agent_demo"
path = "examples/agent_demo.rs"
