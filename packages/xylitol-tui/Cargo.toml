[package]
name = "xylitol-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
description = "Terminal UI with differential rendering (fork derived from pi-tui; diverges for xylitol)"
repository = "https://github.com/straydragon/xylitol"
# Shared `agent_demo_impl.rs` lives under examples/ but is not a binary entry.
autoexamples = false


[dependencies]
crossterm = "0.29"
unicode-width = "0.2"
unicode-segmentation = "1.12"
pulldown-cmark = "0.13"
tokio = { version = "1", features = ["rt", "time", "macros"] }
tokio-util = "0.7"
similar = "3.1"
syntect = { version = "5", default-features = false, features = ["default-fancy"], optional = true }
two-face = { version = "0.5", default-features = false, features = ["syntect-default-fancy"], optional = true }

[features]
default = ["highlight"]
# Real syntect highlighter for MarkdownTheme.highlight_code (demo + product).
highlight = ["dep:syntect", "dep:two-face"]


[dev-dependencies]
vte = "0.13"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "test-util"] }
# insta: whole-screen snapshot golden (c405 layer 2) — viewport output regression.
insta = { version = "1", features = ["filters"] }
tempfile = "3"

[[example]]
name = "agent_demo"
path = "examples/agent_demo.rs"

[[example]]
name = "agent_demo_alt"
path = "examples/agent_demo_alt.rs"

[[example]]
name = "host_loop_application_owned"
path = "examples/host_loop_application_owned.rs"
