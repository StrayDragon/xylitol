[package]
name = "xylitol-official-plugin-tools"
version = "0.0.0-pre"
edition = "2024"
rust-version = "1.99.0"
license = "MIT"
description = "Official Host plugin: built-in tools"
repository = "https://github.com/straydragon/xylitol"
publish = false

[dependencies]
xylitol-plugin-sdk = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
futures = { workspace = true }
image = { workspace = true, features = ["png", "jpeg", "gif", "webp"] }
libc = { workspace = true }
log = { workspace = true }
schemars = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
strum = { workspace = true, features = ["derive"] }
similar = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
