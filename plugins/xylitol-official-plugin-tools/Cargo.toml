[package]
name = "xylitol-official-plugin-tools"
version = "0.0.0-pre"
edition = "2024"
rust-version = "1.99.0"
license = "MIT"
description = "Official Host plugin: built-in tools"
repository = "https://github.com/straydragon/xylitol"
publish = false

[dependencies]
xylitol-plugin-sdk = { path = "../../crates/xylitol-plugin-sdk" }
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
libc = "0.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.28", features = ["derive"] }
similar = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
