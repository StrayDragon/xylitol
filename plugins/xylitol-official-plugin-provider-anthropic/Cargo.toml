[package]
name = "xylitol-official-plugin-provider-anthropic"
version = "0.0.0-pre"
edition = "2024"
rust-version = "1.99.0"
license = "MIT"
description = "Official Host plugin: Anthropic Messages HTTP"
repository = "https://github.com/straydragon/xylitol"
publish = false

[dependencies]
xylitol-plugin-sdk = { path = "../../crates/xylitol-plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
async-stream = "0.3"
tokio = { version = "1", features = ["time", "sync", "macros", "rt"] }
reqwest = { version = "0.13", features = ["stream", "json"] }
eventsource-stream = "0.2"
fastrace = { version = "0.7", features = ["enable"] }
uuid = { version = "1", features = ["v4"] }
log = "0.4"
partial-json-fixer = "0.5.5"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
