[package]
name = "xylitol-official-plugin-provider-anthropic"
version = "0.0.0-pre"
edition = "2024"
rust-version = "1.99.0"
license = "MIT"
description = "Official Host plugin: Anthropic Messages HTTP"
repository = "https://github.com/straydragon/xylitol"
publish = false

[dependencies]
xylitol-plugin-sdk = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
async-stream = { workspace = true }
tokio = { workspace = true, features = ["time", "sync", "macros", "rt"] }
reqwest = { workspace = true, features = ["stream", "json"] }
eventsource-stream = { workspace = true }
fastrace = { workspace = true, features = ["enable"] }
uuid = { workspace = true, features = ["v4"] }
log = { workspace = true }
partial-json-fixer = { workspace = true }

[dev-dependencies]
wiremock = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
