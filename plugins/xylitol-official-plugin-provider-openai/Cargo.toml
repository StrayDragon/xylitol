[package]
name = "xylitol-official-plugin-provider-openai"
version = "0.0.0-pre"
edition = "2024"
rust-version = "1.99.0"
license = "MIT"
description = "Official Host plugin: OpenAI-compatible HTTP"
repository = "https://github.com/straydragon/xylitol"
publish = false

[dependencies]
xylitol-plugin-sdk = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
async-stream = { workspace = true }
tokio = { workspace = true, features = ["time", "sync", "macros", "rt"] }
tokio-util = { workspace = true }
reqwest = { workspace = true, features = ["stream", "json"] }
eventsource-stream = { workspace = true }
async-openai = { workspace = true, features = [
  "chat-completion",
  "responses",
  "byot",
  "middleware",
  "rustls",
] }
tower = { workspace = true, features = ["util"] }
fastrace = { workspace = true, features = ["enable"] }
uuid = { workspace = true, features = ["v4"] }
log = { workspace = true }
strum = { workspace = true, features = ["derive"] }
partial-json-fixer = { workspace = true }

[dev-dependencies]
wiremock = { workspace = true }
tempfile = { workspace = true }
yaml_serde = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
