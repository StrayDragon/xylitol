[package]
name = "xylitol-official-plugin-mcp"
version.workspace = true
edition = "2024"
rust-version = "1.99.0"
license = "MIT"
description = "Official Host plugin: MCP (config-gated)"
repository = "https://github.com/straydragon/xylitol"
publish = false

[features]
default = ["mcp"]
mcp = []

[dependencies]
xylitol-plugin-sdk = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
log = { workspace = true }
rmcp = { workspace = true, features = ["client", "auth", "transport-child-process", "transport-streamable-http-client", "transport-streamable-http-client-reqwest"] }
keyring = "4"
oauth2 = { version = "5.0", default-features = false }
reqwest = { workspace = true, default-features = false, features = ["rustls", "json", "form"] }
schemars = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "process", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util"] }
url = { workspace = true }
