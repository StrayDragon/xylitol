[package]
name = "xylitol-official-plugin-mcp"
version = "0.0.0-pre"
edition = "2024"
rust-version = "1.99.0"
license = "MIT"
description = "Official Host plugin: MCP (config-gated)"
repository = "https://github.com/straydragon/xylitol"
publish = false

[features]
default = ["mcp"]
mcp = ["dep:rmcp"]

[dependencies]
xylitol-plugin-sdk = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
log = { workspace = true }
rmcp = { workspace = true, optional = true, features = ["client", "transport-child-process", "transport-streamable-http-client", "transport-streamable-http-client-reqwest"] }
schemars = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "process", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
