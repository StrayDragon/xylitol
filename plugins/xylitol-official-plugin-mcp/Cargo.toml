[package]
name = "xylitol-official-plugin-mcp"
version = "0.0.0-pre"
edition = "2024"
rust-version = "1.99.0"
license = "MIT"
description = "Official Host plugin: MCP (config-gated)"
repository = "https://github.com/straydragon/xylitol"
publish = false

[features]
default = ["mcp"]
mcp = ["dep:rmcp"]

[dependencies]
xylitol-plugin-sdk = { path = "../../crates/xylitol-plugin-sdk" }
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
http = "1"
log = "0.4"
rmcp = { version = "3.5.1", optional = true, features = ["client", "transport-child-process", "transport-streamable-http-client", "transport-streamable-http-client-reqwest"] }
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
