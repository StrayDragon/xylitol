[package]
name = "xylitol-official-plugin-session"
version = "0.0.0-pre"
edition = "2024"
rust-version = "1.99.0"
license = "MIT"
description = "Official Host plugin: session store"
repository = "https://github.com/straydragon/xylitol"
publish = false

[dependencies]
xylitol-plugin-sdk = { workspace = true }
async-trait = { workspace = true }
dirs = { workspace = true }
libc = { workspace = true }
log = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt", "sync"] }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
