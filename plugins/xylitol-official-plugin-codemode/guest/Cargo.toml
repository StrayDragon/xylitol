[package]
name = "xylitol-codemode-guest"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
rquickjs = { version = "0.14.0", features = ["full-wasi"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[workspace]
