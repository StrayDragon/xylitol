[package]
name = "xylitol-official-plugin-codemode"
version = "0.0.0-pre"
edition = "2024"
rust-version = "1.99.0"
license = "MIT"
repository = "https://github.com/straydragon/xylitol"
publish = false

[dependencies]
xylitol-plugin-sdk = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
wasmtime = { version = "=50.0.1", default-features = false, features = ["async", "cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "=50.0.1", default-features = false, features = ["p1"] }

[dev-dependencies]
tempfile = { workspace = true }
