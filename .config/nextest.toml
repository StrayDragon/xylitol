[profile.ci]
fail-fast = false
slow-timeout = "60s"
# Live HTTP provider suite is opted into `just qa` → `test-live-provider`
# (serial --test-threads=1). Keep it out of the parallel matrix so local
# llama.cpp / Ornith is not hammered alongside unit tests.
default-filter = "not binary(live_responses_prompt_cache)"

[profile.ci.junit]
path = "junit.xml"

# Agent / `just qa` default: failures only, no pass/progress noise.
# Note: in-process `#[serial(domain)]` does not cross nextest process-per-test
# boundaries. Domain groups document cargo-test mutual exclusion; shared
# external resources (ports/FS) would use `[test-groups]` here if needed.
[profile.agent]
fail-fast = false
slow-timeout = "60s"
status-level = "fail"
final-status-level = "fail"
default-filter = "not binary(live_responses_prompt_cache)"
