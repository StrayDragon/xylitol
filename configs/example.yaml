# xylitol example configuration
# Place as xylitol.yaml or .xylitol.yaml in your project root,
# or at $XDG_CONFIG_HOME/xylitol/config.yaml

model:
  default_model: "claude"
  models:
    claude:
      provider: anthropic
      model: claude-sonnet-4-20250514
    gpt:
      provider: openai
      model: gpt-4o
      fallback: claude

execution:
  max_retries: 3
  # system_prompt: "Custom system prompt override"
  # model: "claude"  # override default per-execution

security:
  enabled: true
  bash:
    blocked_commands:
      - "rm -rf /"
      - ":(){ :|:& };:"
    allowed_directories:
      - "."
      - "/tmp"
  filesystem:
    allowed_globs:
      - "**/*"
    blocked_globs:
      - "**/.env"
      - "**/secrets/**"
  network:
    allowed_domains:
      - "api.anthropic.com"
      - "api.openai.com"
    blocked_domains: []
  tool_allowlist: []
  mcp_allowlist: []

tools:
  allowlist: []
  blocklist: []
  max_results: 1000
  max_file_size: 10485760  # 10 MB
  max_dir_entries: 1000

hooks:
  pre_tool_call: []
  post_tool_call: []

