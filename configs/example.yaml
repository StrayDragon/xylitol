# xylitol example configuration
# Place as xylitol.yaml or .xylitol.yaml in your project root,
# or at $XDG_CONFIG_HOME/xylitol/config.yaml

models:
  default_model: "claude"
  models:
    claude:
      provider: anthropic
      model: claude-sonnet-4-20250514
    gpt:
      provider: openai
      model: gpt-4o
      fallback: claude

execution:
  max_retries: 3
  # system_prompt: "Custom system prompt override"
  # model: "claude"  # override default per-execution

security:
  enabled: true
  permission:
    enabled: false
    backend: glob  # glob (default) | landlock (Linux ≥5.13) | macos
    filesystem:
      read_allowed: []   # non-empty = default-deny for unlisted paths
      write_allowed: []
      write_denied:
        - "**/.env"
        - "**/secrets/**"
    network:
      allowed_domains: []  # non-empty = default-deny for unlisted domains
      denied_domains: []
    process:
      allowed_paths: []

tools:
  allowlist: []
  blocklist: []
  max_results: 1000
  max_file_size: 10485760  # 10 MB
  max_dir_entries: 1000

hooks:
  pre_tool_call: []
  post_tool_call: []

