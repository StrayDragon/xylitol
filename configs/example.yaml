# Optional remote traces (OTLP/HTTP → Langfuse / Collector). Default: none.
# Requires Cargo feature `otel` (in default features). Secrets via secret.env.
# otel:
#   exporter: otlp-http   # or omit / none
#   # endpoint: "http://localhost:3000/api/public/otel"
#   # (or set LANGFUSE_BASE_URL in secret.env → …/api/public/otel)
