#:schema https://raw.githubusercontent.com/Goldziher/uncomment/main/schema/uncomment.schema.json
#
# xylitol: AST-accurate comment policy (uncomment).
# - Doc comments / docstrings are removable (`remove_docs = true`); API prose lives
#   in specs / rustdoc on docs.rs is not maintained in-tree via `///`.
# - Gate via `scripts/check_uncomment.py` (`--check --changed-lines` only).
# - Mark anything you must keep with `~keep` on the line above or in the comment.

[global]
remove_todos = false
remove_fixme = false
remove_docs = true
preserve_patterns = [
  "~keep",
  "LLMANSPEC",
  "NOTE:",
  "WORKAROUND",
]
exclude = [
  ".uncomment.toml",
  "vendor/**",
  "target/**",
  ".tools/**",
  "**/snapshots/**",
  "**/*.snap",
  "llmanspec/changes/archive/**",
  "llmanspec/delayed-changes/**",
  "llmanspec/specs/**/*.feature",
  "crates/**/llmanspec/specs/**/*.feature",
  "plugins/**/llmanspec/specs/**/*.feature",
  "docs/book/**",
]
use_default_ignores = false
respect_gitignore = true
traverse_git_repos = false

[languages.rust]
name = "Rust"
extensions = [".rs"]
comment_nodes = ["line_comment", "block_comment"]
doc_comment_nodes = ["doc_comment"]
preserve_patterns = ["clippy:", "#[allow", "#[deny", "#[warn", "#[forbid", "rustfmt::skip", "cfg("]
remove_docs = true

[languages.python]
name = "Python"
extensions = [".py", ".pyw", ".pyi"]
comment_nodes = ["comment"]
preserve_patterns = ["mypy:", "type:", "noqa:", "pragma:", "pylint:", "ruff:", "fmt:"]
remove_docs = true

[languages.javascript]
name = "JavaScript"
extensions = [".js", ".jsx", ".mjs", ".cjs"]
comment_nodes = ["comment"]
preserve_patterns = ["@ts-expect-error", "@ts-ignore", "eslint-", "prettier-ignore", "biome-ignore"]

[languages.yaml]
name = "YAML"
extensions = [".yml", ".yaml"]
comment_nodes = ["comment"]
preserve_patterns = ["yamllint"]

[languages.toml]
name = "TOML"
extensions = [".toml"]
comment_nodes = ["comment"]

[languages.markdown]
name = "Markdown"
extensions = [".md", ".markdown"]
comment_nodes = ["html_block"]
preserve_patterns = ["markdownlint", "prettier-ignore", "vale ", "doctoc", "~keep"]

# Gherkin `.feature` specs are excluded (grammar not wired); BDD prose stays untouched.

[patterns."**/*.generated.*"]
remove_docs = true
remove_todos = true

# Tag-comment lint is manual only (`uncomment lint …`); `just qa` runs `--check` only.
[lint]
enabled = false
canonical_tag = "TODO"
tags = ["TODO", "FIXME", "HACK", "XXX"]
key_pattern = '^\s*(?:TODO|FIXME|HACK|XXX)\((?<key>#\d+)\)\s*:'
case_sensitive_tags = false
include_doc_comments = false
