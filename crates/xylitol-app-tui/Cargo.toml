[package]
name = "xylitol-app-tui"
version = "0.0.0-pre"
edition = "2024"
rust-version = "1.99.0"
license = "MIT"
description = "Product TUI client (envelope + xylitol-tui)"
repository = "https://github.com/straydragon/xylitol"
publish = false

[lib]
# Copied host/bridge unit tests still name the old xylitol tree; product
# TUI behavior is covered by `tests/bdd/steps_app_tui_*` until retargeted.
test = false
doctest = false

[dependencies]
xylitol-protocol = { path = "../xylitol-protocol" }
xylitol-tui = { path = "../xylitol-tui" }
xylitol-plugin-sdk = { path = "../xylitol-plugin-sdk" }
anyhow = "1"
async-stream = "0.3"
async-trait = "0.1"
base64 = "0.22"
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "7"
futures = "0.3"
libc = "0.2"
log = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["unbounded_depth"] }
strum = { version = "0.28", features = ["derive"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["fs", "macros", "rt", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["connect", "handshake"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(feature, values("host-itest", "server"))'] }

[dev-dependencies]
tempfile = "3"
