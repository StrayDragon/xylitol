[package]
name = "xylitol-app-tui"
version = "0.0.0-pre"
edition = "2024"
rust-version = "1.99.0"
license = "MIT"
description = "Product TUI client (JSON-RPC host client + xylitol-tui)"
repository = "https://github.com/straydragon/xylitol"
publish = false

[lib]
doctest = false

[dependencies]
xylitol-protocol = { workspace = true }
xylitol-wire = { workspace = true }
xylitol-tui = { workspace = true }
xylitol-plugin-sdk = { workspace = true }
anyhow = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
crossterm = { workspace = true, features = ["event-stream"] }
dirs = { workspace = true }
futures = { workspace = true }
libc = { workspace = true }
log = { workspace = true }
regex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["unbounded_depth"] }
strum = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
time = { workspace = true, features = ["formatting", "parsing"] }
tokio = { workspace = true, features = ["fs", "macros", "rt", "signal", "sync", "time"] }
tokio-tungstenite = { workspace = true, features = ["connect", "handshake"] }
tokio-util = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(feature, values("server"))'] }

[dev-dependencies]
insta = { workspace = true }
tempfile = { workspace = true }
