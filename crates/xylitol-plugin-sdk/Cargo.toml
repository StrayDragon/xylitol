[package]
name = "xylitol-plugin-sdk"
version = "0.0.0-pre"
edition = "2024"
rust-version = "1.99.0"
license = "MIT"
description = "Vocabulary, ports, and errors for Host plugins"
repository = "https://github.com/straydragon/xylitol"
publish = false

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
fastrace = { workspace = true, features = ["enable"] }
futures = { workspace = true }
log = { workspace = true }
regex = { workspace = true }
schemars = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["unbounded_depth"] }
strum = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
time = { workspace = true, features = ["formatting", "parsing", "macros"] }
tokio = { workspace = true, features = ["sync", "macros", "rt", "time"] }
tokio-util = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
insta = { workspace = true }
yaml_serde = { workspace = true }
