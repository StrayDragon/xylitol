[package]
name = "xylitol-runtime"
version = "0.0.0-pre"
edition = "2024"
rust-version = "1.99.0"
license = "MIT"
description = "Execution authority: XyDriver, trust, session slots, ReAct"
repository = "https://github.com/StrayDragon/xylitol"
publish = false

[lib]
doctest = false

[dependencies]
xylitol-plugin-sdk = { workspace = true }
anyhow = { workspace = true }
async-stream = { workspace = true }
dirs = { workspace = true }
async-trait = { workspace = true }
fastrace = { workspace = true, features = ["enable"] }
futures = { workspace = true }
glob = { workspace = true }
log = { workspace = true }
minijinja = { workspace = true, features = ["json", "builtins", "serde"] }
regex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["unbounded_depth"] }
sha2 = { workspace = true }
strum = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
time = { workspace = true, features = ["formatting", "parsing", "macros"] }
tokio = { workspace = true, features = ["fs", "macros", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
insta = { workspace = true }
tempfile = { workspace = true }
xylitol-plugin-sdk = { workspace = true }
