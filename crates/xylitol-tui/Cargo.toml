[package]
name = "xylitol-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "MIT"
description = "Terminal UI with differential rendering (fork derived from pi-tui; diverges for xylitol)"
repository = "https://github.com/straydragon/xylitol"
autoexamples = false


[dependencies]
crossterm = { workspace = true }
unicode-width = { workspace = true }
unicode-segmentation = { workspace = true }
pulldown-cmark = { workspace = true }
mermaid-text = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "macros"] }
tokio-util = { workspace = true }
similar = { workspace = true }
strum = { workspace = true, features = ["derive"] }
syntect = { workspace = true, features = ["default-fancy"], optional = true }
two-face = { workspace = true, features = ["syntect-default-fancy"], optional = true }

[features]
default = ["highlight"]
highlight = ["dep:syntect", "dep:two-face"]


[dev-dependencies]
vte = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "test-util"] }
insta = { workspace = true, features = ["filters"] }
tempfile = { workspace = true }

[[example]]
name = "agent_demo"
path = "examples/agent_demo.rs"

[[example]]
name = "agent_demo_alt"
path = "examples/agent_demo_alt.rs"

[[example]]
name = "host_loop_application_owned"
path = "examples/host_loop_application_owned.rs"
