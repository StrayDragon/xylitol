[package]
name = "xylitol-protocol"
version = "0.0.0-pre"
edition = "2024"
rust-version = "1.99.0"
license = "MIT"
description = "JSON-RPC 2.0 product wire protocol (methods, notifications, events)"
repository = "https://github.com/straydragon/xylitol"
publish = false

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["unbounded_depth"] }
strum = { workspace = true, features = ["derive"] }
