[package]
name = "xylitol-app-print"
version = "0.0.0-pre"
edition = "2024"
rust-version = "1.99.0"
license = "MIT"
description = "Print client (in-process XyDriver, no fory)"
repository = "https://github.com/straydragon/xylitol"
publish = false

[dependencies]
xylitol-runtime = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true, features = ["unbounded_depth"] }
thiserror = { workspace = true }
log = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
