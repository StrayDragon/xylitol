[package]
name = "xylitol-app-print"
version = "0.0.0-pre"
edition = "2024"
rust-version = "1.99.0"
license = "MIT"
description = "Print client (in-process XyDriver, no fory)"
repository = "https://github.com/straydragon/xylitol"
publish = false

[dependencies]
xylitol-runtime = { path = "../xylitol-runtime" }
futures = "0.3"
serde_json = { version = "1", features = ["unbounded_depth"] }
thiserror = "2"
log = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
