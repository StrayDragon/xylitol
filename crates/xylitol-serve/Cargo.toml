[package]
name = "xylitol-serve"
version = "0.0.0-pre"
edition = "2024"
rust-version = "1.99.0"
license = "MIT"
description = "HTTP/WS carrier and XyEvent ↔ v3 mapping"
repository = "https://github.com/StrayDragon/xylitol"
publish = false

[dependencies]
xylitol-runtime = { workspace = true }
xylitol-plugin-sdk = { workspace = true }
xylitol-protocol = { workspace = true }
log = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["unbounded_depth"] }
thiserror = { workspace = true }
async-trait = { workspace = true, optional = true }
dirs = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
salvo = { workspace = true, optional = true, features = ["server", "server-handle", "http1", "websocket", "test"] }
tokio = { workspace = true, optional = true, features = ["macros", "net", "rt", "signal", "sync", "time"] }
url = { workspace = true, optional = true }
uuid = { workspace = true, optional = true, features = ["v4"] }

[dev-dependencies]
fory = { workspace = true }
strum = { workspace = true, features = ["derive"] }

[features]
default = ["listen"]
listen = ["dep:async-trait", "dep:dirs", "dep:futures", "dep:salvo", "dep:tokio", "dep:url", "dep:uuid"]
