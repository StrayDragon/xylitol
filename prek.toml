# prek.toml - Git hook configuration for xylitol
# Docs: https://github.com/j178/prek
#
# Scope rule — prek and `just qa` are layered, not duplicated
# (root AGENTS.md 命令与验证):
# - pre-commit: text/metadata hygiene + commit-msg convention ONLY. Never add
#   individual cargo gates (fmt / clippy / test / doc-test) as hooks — their
#   single source of truth is `just qa`.
# - pre-push: runs `just qa` wholesale (full gate before every push; escape
#   hatch `git push --no-verify`).

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "check-merge-conflict" },
  { id = "check-added-large-files", args = ["--maxkb=512"] },
  { id = "mixed-line-ending", args = ["--fix=lf"] },
  { id = "detect-private-key" },
  { id = "check-case-conflict" },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "just-qa"
name = "just qa (full pre-push gate)"
language = "system"
entry = "just qa"
pass_filenames = false
stages = ["pre-push"]

[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "v4.4.0"
hooks = [{ id = "conventional-pre-commit", stages = ["commit-msg"] }]
