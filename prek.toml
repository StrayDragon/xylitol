# prek.toml - Git hook configuration for xylitol
# Docs: https://github.com/j178/prek
#
# Scope rule — prek and `just qa` are orthogonal (root AGENTS.md 命令与验证):
# prek carries ONLY text/metadata hygiene hooks and the commit-msg convention.
# Cargo-level gates (fmt / clippy / test / doc-test) MUST NOT be added here;
# they live in `just qa` alone, which runs `prek run --all-files` unfiltered.

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "check-merge-conflict" },
  { id = "check-added-large-files", args = ["--maxkb=512"] },
  { id = "mixed-line-ending", args = ["--fix=lf"] },
  { id = "detect-private-key" },
  { id = "check-case-conflict" },
]

[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "v4.4.0"
hooks = [{ id = "conventional-pre-commit", stages = ["commit-msg"] }]
