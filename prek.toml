# prek.toml - Git hook configuration for xylitol
# Docs: https://github.com/j178/prek
#
# Scope rule — prek and `just qa` are orthogonal (root AGENTS.md 命令与验证):
# - prek hooks (any stage) carry ONLY text/metadata hygiene and the commit-msg
#   convention. Never add cargo gates (fmt / clippy / test / doc-test) as
#   hooks — `just qa` is the dev-time gate, run manually.
# - Push-time consistency is CI's job (GitHub Actions), not local hooks: keep
#   pre-commit fast and pushes unblocked. LFS pre-push is owned by git-lfs's
#   native hooks (`just setup` runs `git lfs install --local`).

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "check-merge-conflict" },
  { id = "check-added-large-files", args = ["--maxkb=512"] },
  { id = "mixed-line-ending", args = ["--fix=lf"] },
  { id = "detect-private-key" },
  { id = "check-case-conflict" },
]

[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "v4.4.0"
# Positional types REPLACE the hook's default whitelist (build/chore/ci/docs/
# feat/fix/perf/refactor/revert/style/test). Two additions:
# - `archive` — llman `change finalize` 的原生收口前缀（`archive(sdd): <id>`）；
# - `agentdev` — 既有的工具链升级 type（llman/rust-toolchain bump）。
hooks = [
  { id = "conventional-pre-commit", stages = ["commit-msg"], args = [
    "build", "chore", "ci", "docs", "feat", "fix", "perf", "refactor",
    "revert", "style", "test", "agentdev", "archive",
  ] },
]
