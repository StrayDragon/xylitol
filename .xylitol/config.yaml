# yaml-language-server: $schema=../configs/config.schema.json
#
# 仓库共享配置（可进 git）。无密钥。
# 加载顺序（低→高）：~/.config/xylitol/config.yaml → 本文件 → --config
# 密钥放 .xylitol/secret.env（或 ~/.config/xylitol/secret.env）。
# YAML 插值：secret.NAME（须在 secret.env 定义）；vars.home（用户 home）；env.KEY。
# 勿在注释里写未转义的双花括号示例。
# 不再支持 config.local.yaml。
#
# models: 来自 pi providers dump；键与 `model` 均用上游 name/id，不做别名转换。
#
# --- 本仓开发向「全功能」剖面（看效果用）---
# - tool_batch.barrier_parallel：同 turn 纯读扇出 + 写/bash/mcp 屏障
# - models.*.api：openai-responses（llama.cpp / 兼容端；Completions 仅遗留显式档）
# - APPEND_SYSTEM.md：实验 3 多-tool 策略片段（临时；见 c1610/experiments.md）
# - local_tokenizer：开发可按需 on（当前 off）
# - compaction enabled：长会话压缩
# - mcp_servers + otel I/O full：见文末（密钥仍在 secret.env）
# 启动模型优先级：agents.profiles.<default>.model → execution.model → models.default_model
# 产品默认仍是 sequential / tokenizer off / otel none；勿把本剖面当发布默认。
# api: openai-responses（c1598 起配置生效）。APPEND_SYSTEM.md = 实验 3 临时多-tool 提示。

# 同 turn 工具批（c1545）：开发默认开试验档，便于体感并行读
tool_batch:
  mode: barrier_parallel

# 本地 tokenizer encode（引号避免 YAML 1.1 布尔别名）
token_estimate:
  local_tokenizer: "off"

# 长会话压缩（缺省未写时看代码默认；此处显式打开）
compaction:
  enabled: true

tokenizers:
  qwen36:
    repo: Qwen/Qwen3.6-35B-A3B
    # file: tokenizer.json

