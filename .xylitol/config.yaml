agents:
  default_profile: default
  profiles:
    default:
      # 与 models.default_model 对齐；若只改 default_model 而这里不改，启动仍用此处
      model: "Ornith-1.0-35B-MTP-APEX/I-Quality"

mcp_servers:
  - name: context7
    transport: sse
    url: https://mcp.context7.com/mcp
    headers:
      CONTEXT7_API_KEY: "{{ secret.CONTEXT7_API_KEY }}"

  - name: lspz
    transport: stdio
    command: "{{ vars.home }}/.cargo/bin/lspz"
    args: ["mcp"]

# Optional OTLP → Langfuse (c1475). Keys in secret.env (LANGFUSE_*).
# Product defaults (code): exporter=none, observation_io=none, tool_observation_io=none
# → even with exporter on, only structural metadata (session/model/latency/types/usage).
# This workspace profile: export on + I/O full for local debug / Langfuse tuning.
otel:
  exporter: otlp-http
  protocol: http-json
  environment: dev
  service_name: xylitol
  # endpoint omitted → LANGFUSE_BASE_URL + /api/public/otel/v1/traces
  observation_io: full
  tool_observation_io: full
