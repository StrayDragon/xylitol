edition = "2024"
max_width = 100
hard_tabs = false
tab_spaces = 4
newline_style = "Unix"
reorder_imports = true
reorder_modules = true
use_field_init_shorthand = true
use_try_shorthand = true
force_explicit_abi = true

# foryc 生成物(空 struct 展开形态与 rustfmt 风格冲突;c2834 codegen SSOT)
ignore = ["src/protocol/wire/v3/generated.rs"]
