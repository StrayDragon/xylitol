name: CRAP duplicates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crap-dup-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  duplicates:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v2

      - uses: Swatinem/rust-cache@v2

      - name: Install WASI SDK 24
        run: |
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors -o "$RUNNER_TEMP/wasi-sdk.tar.gz" https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-24/wasi-sdk-24.0-x86_64-linux.tar.gz
          mkdir -p "$RUNNER_TEMP/wasi-sdk"
          tar -xzf "$RUNNER_TEMP/wasi-sdk.tar.gz" -C "$RUNNER_TEMP/wasi-sdk" --strip-components=1
          echo "WASI_SDK_PATH=$RUNNER_TEMP/wasi-sdk" >> "$GITHUB_ENV"

      - name: Add wasm32-wasip1 target
        run: rustup target add wasm32-wasip1

      - name: Install cargo-crap
        run: cargo install cargo-crap --version 0.9.0 --locked

      - name: Structural duplicate radar (informational)
        run: |
          cargo crap --workspace --duplicates --summary --format markdown \
            > "${RUNNER_TEMP}/crap-duplicates.md"
          cat "${RUNNER_TEMP}/crap-duplicates.md" >> "$GITHUB_STEP_SUMMARY"
