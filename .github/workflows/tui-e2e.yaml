name: TUI E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: tui-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tui-e2e:
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'tui-e2e')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v2

      - uses: Swatinem/rust-cache@v2

      - name: Install tmux + test deps + Linux linker
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux ripgrep fd-find clang mold
          sudo ln -sf /usr/bin/fdfind /usr/local/bin/fd

      - name: Install WASI SDK 24
        run: |
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors -o "$RUNNER_TEMP/wasi-sdk.tar.gz" https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-24/wasi-sdk-24.0-x86_64-linux.tar.gz
          mkdir -p "$RUNNER_TEMP/wasi-sdk"
          tar -xzf "$RUNNER_TEMP/wasi-sdk.tar.gz" -C "$RUNNER_TEMP/wasi-sdk" --strip-components=1
          echo "WASI_SDK_PATH=$RUNNER_TEMP/wasi-sdk" >> "$GITHUB_ENV"
          echo "WASI_SDK=$RUNNER_TEMP/wasi-sdk" >> "$GITHUB_ENV"

      - name: Add wasm32-wasip1 target
        run: rustup target add wasm32-wasip1

      - name: Build product binary
        run: cargo build --bin xylitol

      - name: TUI PTY/tmux E2E
        run: cargo test --test tui_e2e -- --ignored --test-threads=1
