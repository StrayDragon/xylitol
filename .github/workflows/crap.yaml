name: CRAP

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: crap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  crap:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      XYLITOL_SKIP_LIVE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov

      - name: Pin cargo-llvm-cov (object-file collection needs ≥0.9.1)
        run: cargo install cargo-llvm-cov --version 0.9.1 --locked

      - uses: minikin/cargo-crap@v1
        with:
          version: "0.9.0"
          args: --workspace
          coverage-args: >-
            nextest --workspace --all-features --profile ci
            -E 'not (package(xylitol-tui) or binary(lab_responses_prompt_cache))'
          fail-regression: "true"
          fail-above: "false"
