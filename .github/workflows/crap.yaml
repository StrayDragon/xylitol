name: CRAP

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: crap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  crap:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect Rust changes
        id: changes
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" \
            | grep -Eq '[.]rs$|(^|/)Cargo[.](toml|lock)$|(^|/)rust-toolchain[.]toml$|(^|/)[.]cargo/'; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip CRAP (no Rust changes)
        if: github.event_name == 'pull_request' && steps.changes.outputs.rust != 'true'
        run: echo "No Rust changes; skipping coverage and CRAP scoring."

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        if: github.event_name != 'pull_request' || steps.changes.outputs.rust == 'true'
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        if: github.event_name != 'pull_request' || steps.changes.outputs.rust == 'true'

      - name: Install rg + fd + clang + mold (test deps / Linux linker)
        if: github.event_name != 'pull_request' || steps.changes.outputs.rust == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep fd-find clang mold
          sudo ln -sf /usr/bin/fdfind /usr/local/bin/fd

      - uses: taiki-e/install-action@v2
        if: github.event_name != 'pull_request' || steps.changes.outputs.rust == 'true'
        with:
          tool: cargo-nextest,cargo-llvm-cov

      - name: Install WASI SDK 24
        run: |
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors -o "$RUNNER_TEMP/wasi-sdk.tar.gz" https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-24/wasi-sdk-24.0-x86_64-linux.tar.gz
          mkdir -p "$RUNNER_TEMP/wasi-sdk"
          tar -xzf "$RUNNER_TEMP/wasi-sdk.tar.gz" -C "$RUNNER_TEMP/wasi-sdk" --strip-components=1
          echo "WASI_SDK_PATH=$RUNNER_TEMP/wasi-sdk" >> "$GITHUB_ENV"
          echo "WASI_SDK=$RUNNER_TEMP/wasi-sdk" >> "$GITHUB_ENV"

      - name: Add wasm32-wasip1 target
        run: rustup target add wasm32-wasip1

      - name: Install cargo-crap
        if: github.event_name != 'pull_request' || steps.changes.outputs.rust == 'true'
        run: cargo install cargo-crap --version 0.9.0 --locked --root .tools

      - uses: minikin/cargo-crap@v1
        if: github.event_name != 'pull_request' || steps.changes.outputs.rust == 'true'
        with:
          binary: .tools/bin/cargo-crap
          args: --workspace
          coverage-args: >-
            nextest --workspace --all-features --profile ci
            -E 'not package(xylitol-tui)'
          fail-regression: "true"
          fail-above: "false"
