name: Eval Binary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v2

      - uses: Swatinem/rust-cache@v2
        with:
          key: eval-bin

      - name: Install WASI SDK 24
        run: |
          curl -fsSL -o "$RUNNER_TEMP/wasi-sdk.tar.gz" https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-24/wasi-sdk-24.0-x86_64-linux.tar.gz
          mkdir -p "$RUNNER_TEMP/wasi-sdk"
          tar -xzf "$RUNNER_TEMP/wasi-sdk.tar.gz" -C "$RUNNER_TEMP/wasi-sdk" --strip-components=1
          echo "WASI_SDK_PATH=$RUNNER_TEMP/wasi-sdk" >> "$GITHUB_ENV"

      - name: Add wasm32-wasip1 target
        run: rustup target add wasm32-wasip1

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang mold cmake libssl-dev pkg-config perl nasm musl-tools

      - name: Build Linux binary
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Strip and checksum
        run: |
          strip target/x86_64-unknown-linux-musl/release/xylitol
          sha256sum target/x86_64-unknown-linux-musl/release/xylitol > target/xylitol-linux-x86_64-musl.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: xylitol-linux-x86_64-musl
          path: |
            target/x86_64-unknown-linux-musl/release/xylitol
            target/xylitol-linux-x86_64-musl.sha256
          retention-days: 30
