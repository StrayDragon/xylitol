name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v2

      - uses: Swatinem/rust-cache@v2

      - name: Install just + cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest

      - name: Install rg + fd + mold (test deps / Linux linker)
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep fd-find clang mold
          sudo ln -sf /usr/bin/fdfind /usr/local/bin/fd

      - name: Install uv + Python for stateful MCP fixture
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.11"

      - name: Smoke-test stateful MCP fixture
        run: uv run tests/support/mcp_stateful_fixture.py --self-check

      - name: Install prek
        run: pipx install prek

      - name: Install uncomment
        run: pipx install uncomment

      - name: Cache .tools (cccc-rs)
        uses: actions/cache@v6
        with:
          path: .tools
          key: tools-cccc-rs-0.4.0

      - name: Install WASI SDK 24
        run: |
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors -o "$RUNNER_TEMP/wasi-sdk.tar.gz" https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-24/wasi-sdk-24.0-x86_64-linux.tar.gz
          mkdir -p "$RUNNER_TEMP/wasi-sdk"
          tar -xzf "$RUNNER_TEMP/wasi-sdk.tar.gz" -C "$RUNNER_TEMP/wasi-sdk" --strip-components=1
          echo "WASI_SDK_PATH=$RUNNER_TEMP/wasi-sdk" >> "$GITHUB_ENV"

      - name: Add wasm32-wasip1 target
        run: rustup target add wasm32-wasip1

      - name: just qa
        run: just qa quiet
