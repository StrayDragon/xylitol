name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v2

      - uses: Swatinem/rust-cache@v2

      - name: Install just + cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest

      - name: Install rg + fd + mold (test deps / Linux linker)
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep fd-find clang mold
          sudo ln -sf /usr/bin/fdfind /usr/local/bin/fd

      - name: Install prek
        run: pipx install prek

      - name: Install uncomment
        run: pipx install uncomment

      - name: Cache .tools (cccc-rs)
        uses: actions/cache@v4
        with:
          path: .tools
          key: tools-cccc-rs-0.4.0

      - name: just qa
        run: just qa quiet
