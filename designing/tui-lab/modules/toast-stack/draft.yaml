id: toast-stack
title: 右上角通知栈
surface: tui-lab
summary: "右上角堆叠的过程性通知（完成 / 提醒），自动逐条消失。"
alignment:
  fixed: 右上角浮层；错误类仍走现有通知条行，分工采纳时写入 固定区词表
  item: 纯键盘可达：Tab 聚焦最新一条，回车执行动作
keys:
  - { chord: "c", when: "弹出复制成功通知" }
  - { chord: "e", when: "弹出导出完成（带 › open 动作）" }
  - { chord: "Enter", when: "执行最新一条的动作" }
  - { chord: "d", when: "关闭最新一条" }
todos:
  - { done: false, text: "与通知条的分工规则写入 TUI信息呈现与固定区词汇.md" }
  - { done: false, text: "适用消息清单（复制 / 导出等关键确认，过程性消息不进栈）" }
  - { done: false, text: "遮挡规避：与 transcript 滚动区的关系（悬浮 vs 预留列）" }
notes: |
  现状：通知条只有底部单行、且以 Error: 为主要词形，
  「导出完成了」这类关键确认没有合适落点。
  图标：◆ 起头（成功类 ✓），单格宽，与折叠箭头 / 提示符区分。
