id: todo-bar.pending-open
cols: 80
must_contain:
  - "▾ 1 doing"
  - "write todo-bar copy"
  - "▾ 3 pending"
  - "[ ] paint lab states"
  - "[ ] graduate to product"
  - "[ ] wire lower fixed zone"
  - "─── ↓ 1 more ───────────────────────────────────"
must_not_contain:
  - "[~]"
  - "Todo ·"
  - "done "
  - "todo "
  - "…"
lines:
  -
    - { text: "────────────────────────────────────────────────────────────────────────────────", token: muted }
  -
    - { text: "▾ 1 doing", token: muted }
  -
    - { text: "write todo-bar copy", token: on-surface }
  -
    - { text: "▾ 3 pending", token: muted }
  -
    - { text: "[ ] paint lab states", token: muted }
  -
    - { text: "[ ] graduate to product", token: muted }
  -
    - { text: "[ ] wire lower fixed zone", token: muted }
  -
    - { text: "─── ↓ 1 more ───────────────────────────────────────────────────────────────────", token: muted }
