id: todo-bar.no-focus-wide
cols: 100
must_contain:
  - "▾ 0 doing                         ▾ 3 pending"
  - "[ ] paint lab states              [x] read gloss"
  - "[ ] graduate to product           [-] skip overl"
  - "[ ] wire lower fixed zone"
must_not_contain:
  - "[~]"
  - "Todo ·"
  - "done "
  - "todo "
  - "…"
lines:
  -
    - { text: "────────────────────────────────────────────────────────────────────────────────────────────────────", token: muted }
  -
    - { text: "▾ 0 doing                       ", token: muted }
    - { text: "  ", token: muted }
    - { text: "▾ 3 pending                     ", token: muted }
    - { text: "  ", token: muted }
    - { text: "▾ 1 completed · 1 cancelled     ", token: muted }
  -
    - { text: "                                ", token: muted }
    - { text: "  ", token: muted }
    - { text: "[ ] paint lab states            ", token: muted }
    - { text: "  ", token: muted }
    - { text: "[x] read glossary               ", token: muted }
  -
    - { text: "                                ", token: muted }
    - { text: "  ", token: muted }
    - { text: "[ ] graduate to product         ", token: muted }
    - { text: "  ", token: muted }
    - { text: "[-] skip overlay slot           ", token: muted }
  -
    - { text: "                                ", token: muted }
    - { text: "  ", token: muted }
    - { text: "[ ] wire lower fixed zone       ", token: muted }
    - { text: "  ", token: muted }
    - { text: "                                ", token: muted }
  -
    - { text: "────────────────────────────────────────────────────────────────────────────────────────────────────", token: muted }
