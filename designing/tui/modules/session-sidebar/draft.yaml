id: session-sidebar
title: 侧栏（会话侧栏）
category: 槽与面板
surface: tui
summary: "常驻右列：内容区让宽重排；实验特性，现施工中占位。"
alignment:
  fixed: 右缘整高第二列（固定 24 列，总宽不足 26 列整体关闭）；不占 dock 行
  item: 正文按内容宽重排换行（非覆盖截断）
  todo-bar: 无关
keys:
  - { chord: "Alt+u", when: "二态切换（任意槽位）" }
todos:
  - { done: true, text: "c2905 落地：让宽重排 + 通知/弹出框按内容宽收口" }
  - { done: true, text: "c2910：滚动条贴内容右缘；侧栏带内滚轮/选区不作用" }
  - { done: true, text: "c2912：内容降级施工中占位，业务字段待定" }
  - { done: false, text: "业务字段回归 / 侧栏内滚动 / 宽度可调 / 三态循环（c2911 草案候选）" }
notes: |
  实验特性：机制（让宽 / 分区 / 贴靠）保留为试验床；内容为施工中占位（c2912）。
  标准词「侧栏」，弃用「驻列」；与覆盖弹出框（session-popup）显隐互不影响。
