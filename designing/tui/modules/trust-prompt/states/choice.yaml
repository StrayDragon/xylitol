id: trust-prompt.choice
cols: 80
must_contain:
  - "Trust this workspace?"
  - "Allow"
must_not_contain:
  - "Enter a number"
  - "Asking questions"
lines:
  -
    - { text: "Trust this workspace?", token: on-surface }
  -
    - { text: "› Allow once", token: on-surface, rev: true }
  -
    - { text: "  Allow always", token: muted }
  -
    - { text: "  Deny", token: muted }
