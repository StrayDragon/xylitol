id: paste-fold
title: 大粘贴折叠
surface: tui-lab
summary: "大段粘贴折叠为一行摘要；核心问题是光标能否把整块当一个单元移动。"
alignment:
  fixed: 只作用于 editor 槽内容；不进 transcript / scrollback
  item: 与 `$name` 高亮同层的行内区间构造
keys:
  - { chord: "← →", when: "移动光标；unit 模式下整块跳过粘贴区" }
  - { chord: "p", when: "插入示例粘贴块（12 行）" }
  - { chord: "t", when: "切换 unit（提案）/ plain（现状对照）" }
  - { chord: "Backspace", when: "删整块或字符" }
  - { chord: "Enter", when: "查看提交语义提示" }
todos:
  - { done: false, text: "验证「整块单元」可行方案：行内区间 vs 占位符入缓冲" }
  - { done: false, text: "阈值定稿（行数 / 字符数）与配置开关取舍" }
notes: |
  现状：编辑器为纯文本行缓冲，粘贴全量插入；expanded 展开态产品已有
  （即现状本身），故本稿只保留 folded 目标态。提交语义不变是 MUST。
