id: tabs.fit
cols: 40
must_contain:
  - "alpha"
  - "beta"
  - "gamma"
must_not_contain:
  - "←"
  - "→"
  - "(包)"
lines:
  -
    - { text: "alpha", token: on-surface }
    - { text: " ", token: on-surface }
    - { text: "beta", token: on-surface, rev: true }
    - { text: " ", token: on-surface }
    - { text: "gamma", token: on-surface }
