id: todo-bar.past-open
cols: 80
must_contain:
  - "▾ 1 doing"
  - "write todo-bar copy"
  - "▸ 3 pending"
  - "▾ 1 completed · 1 cancelled"
  - "[x] read glossary"
  - "[-] skip overlay slot"
must_not_contain:
  - "[~]"
  - "Todo ·"
  - "done "
  - "todo "
  - "…"
lines:
  -
    - { text: "────────────────────────────────────────────────────────────────────────────────", token: muted }
  -
    - { text: "▾ 1 doing", token: muted }
  -
    - { text: "write todo-bar copy", token: on-surface }
  -
    - { text: "▸ 3 pending", token: muted }
  -
    - { text: "▾ 1 completed · 1 cancelled", token: muted }
  -
    - { text: "[x] read glossary", token: muted }
  -
    - { text: "[-] skip overlay slot", token: muted }
  -
    - { text: "────────────────────────────────────────────────────────────────────────────────", token: muted }
