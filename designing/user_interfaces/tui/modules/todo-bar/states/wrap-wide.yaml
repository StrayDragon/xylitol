id: todo-bar.wrap-wide
cols: 100
must_contain:
  - "▾ 1 doing                         ▸ 3 pending"
  - "Keep the live checklist in the"
  - "lower dock and wrap long titles"
  - "not clipping them"
must_not_contain:
  - "[~]"
  - "Todo ·"
  - "done "
  - "todo "
  - "…"
lines:
  -
    - { text: "────────────────────────────────────────────────────────────────────────────────────────────────────", token: muted }
  -
    - { text: "▾ 1 doing                       ", token: muted }
    - { text: "  ", token: muted }
    - { text: "▸ 3 pending                     ", token: muted }
    - { text: "  ", token: muted }
    - { text: "▸ 1 completed · 1 cancelled     ", token: muted }
  -
    - { text: "Keep the live checklist in the  ", token: on-surface }
    - { text: "  ", token: muted }
    - { text: "                                ", token: muted }
    - { text: "  ", token: muted }
    - { text: "                                ", token: muted }
  -
    - { text: "lower dock and wrap long titles ", token: on-surface }
    - { text: "  ", token: muted }
    - { text: "                                ", token: muted }
    - { text: "  ", token: muted }
    - { text: "                                ", token: muted }
  -
    - { text: "not clipping them               ", token: on-surface }
    - { text: "  ", token: muted }
    - { text: "                                ", token: muted }
    - { text: "  ", token: muted }
    - { text: "                                ", token: muted }
  -
    - { text: "────────────────────────────────────────────────────────────────────────────────────────────────────", token: muted }
