id: markdown.mermaid-too-wide
cols: 12
must_contain:
  - "无法渲染 mermaid"
  - "flowchart"
  - "Start"
must_not_contain:
  - "```"
  - "┌"
  - "└"
notes: |
  窗口比图画出来更窄：不要把流程图从中间折断；红色「无法渲染 mermaid」+ 代码块内源码。
lines:
  -
    - { text: "  无法渲染 mermaid", token: error }
  -
    - { text: "    flowchart LR", token: success }
  -
    - { text: "    Start[Start Label] --> End[End Label]", token: success }
