id: markdown.mermaid-fallback
cols: 80
must_contain:
  - "无法渲染 mermaid"
  - "this is not a diagram"
must_not_contain:
  - "```"
  - "┌"
  - " mermaid:"
notes: |
  画图报错：红色「无法渲染 mermaid」+ 下面代码块内源码（行内代码色，比提示多一档缩进）。
  不要加「mermaid: …」标题框，也不要 ``` 行。画成功的围栏不要跟源码。
lines:
  -
    - { text: "  无法渲染 mermaid", token: error }
  -
    - { text: "    this is not a diagram", token: success }
