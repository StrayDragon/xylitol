id: markdown.mermaid-drawn
cols: 80
must_contain:
  - "Parse"
  - "Layout"
must_not_contain:
  - "```"
notes: |
  已闭合的 mermaid：画成终端流程图。没有 ``` 围栏行。
  太窄见 mermaid-too-wide；语法不是图见 mermaid-fallback。
lines:
  -
    - { text: "Parse", token: assistant }
  -
    - { text: "  │", token: muted }
  -
    - { text: "  ▼", token: muted }
  -
    - { text: "Layout", token: assistant }
