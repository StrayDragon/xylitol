id: status
title: 状态条
category: 固定区
surface: tui
summary: idle 一行空白呼吸距；busy 为 spinner+短词。
alignment:
  fixed: editor 上方；idle 不算 status 文案
  item: 队列条不进本行
  todo-bar: 待办栏在通知条之上；本行仍紧贴 editor
todos:
  - { done: true, text: "lead 不可 space-between 把 Working 顶到行尾" }
notes: |
  代码 SSOT：layout status 槽。短词 Working / Running {name} / Reloading…。无快捷键墙。
