id: session-popup.open
cols: 30
must_contain:
  - "会话详情"
  - "模型"
  - "思考"
  - "目录"
must_not_contain:
  - "(包)"
lines:
  -
    - { text: "┌ 会话详情 ─────────────", token: muted }
  -
    - { text: "会话 <session-id>", token: muted }
  -
    - { text: "模型 <生效模型>", token: muted }
  -
    - { text: "思考 <thinking 档>", token: muted }
  -
    - { text: "目录 <工作目录>", token: muted }
