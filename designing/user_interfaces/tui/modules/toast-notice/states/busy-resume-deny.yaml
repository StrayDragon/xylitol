id: toast-notice.busy-resume-deny
cols: 80
must_contain:
  - "Error:"
  - "BUSY_SESSION_SWITCH_NOTICE"
must_not_contain:
  - "Planning next moves"
  - "Next turn:"
lines:
  -
    - { text: "Error: BUSY_SESSION_SWITCH_NOTICE", token: warning }
  -
    - { text: "⠋ Working", token: accent }
    - { text: "", token: muted }
