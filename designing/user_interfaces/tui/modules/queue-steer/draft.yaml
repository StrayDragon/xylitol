id: queue-steer
title: 队列条
category: 固定区
surface: tui
summary: scrollback 与 status 之间的 Steering / Follow-up 条。
alignment:
  fixed: scrollback → 队列条 → 通知条 → status
  item: 注入后变普通 User 条目
  todo-bar: 待办栏在队列条与通知条之间；本条仍是 steer/follow-up 可见性 SSOT
todos:
  - { done: true, text: "禁止 footer/status 队列徽章" }
keys:
  - { chord: "Enter (busy)", when: "steer 入队" }
  - { chord: "Alt+Enter", when: "follow-up 入队" }
  - { chord: "Alt+Up", when: "还原队列进 editor" }
notes: |
  组件键，不是全局百科。
