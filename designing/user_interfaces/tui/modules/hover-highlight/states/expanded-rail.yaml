id: hover-highlight.expanded-rail
cols: 80
must_contain:
  - "▾"
  - "pub fn"
must_not_contain: []
lines:
  - - { text: "▎", token: success }
    - { text: " ▾ Read foo.rs  (Alt+E)", token: on-surface }
  - - { text: "▎", token: success }
    - { text: " pub fn main() {}", token: on-surface }
  - - { text: "▎", token: success }
    - { text: " ctrl+o to expand", token: muted }
