<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>xylitol designing</title>
  </head>
  <body data-scheme="light">
    <header>
      <h1>xylitol designing</h1>
      <p class="meta">交互设计稿 · 运行时真值以产品代码为准 · 中间终端为产品渲染（默认暗色，可切亮色）</p>
    </header>
    <div class="shell">
      <main>
        <div class="title-row">
          <h2 id="module-title">designing</h2>
          <button
            type="button"
            id="theme-toggle"
            title="切换终端背景"
            aria-label="切换终端背景"
          >
            暗色背景
          </button>
        </div>
        <p class="spec" id="module-spec"></p>
        <div class="chips" id="state-chips"></div>
        <div class="stage-bar" id="stage-bar"></div>
        <div id="stage"></div>
      </main>
      <aside aria-label="设计细节">
        <div class="handoff">
          <button type="button" id="copy-handoff">复制路径</button>
          <code id="endpoint">/tui</code>
          <button
            type="button"
            id="handoff-toggle"
            aria-expanded="false"
            aria-controls="handoff-md"
          >
            展开 ▾
          </button>
          <div id="handoff-md" class="md-body" hidden></div>
        </div>
        <div id="detail"></div>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
